[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forgecrm-api"
version = "0.1.0"
description = "ForgeCRM Backend API — Enterprise CRM Platform"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

dependencies = [
    # ── Web Framework ────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # ── Database ─────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",

    # ── Validation ───────────────────────────────────────────────
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",

    # ── Authentication ───────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # ── Redis ────────────────────────────────────────────────────
    "redis[hiredis]>=5.1.0",

    # ── Object Storage ───────────────────────────────────────────
    "boto3>=1.35.0",
    "botocore>=1.35.0",

    # ── Logging ──────────────────────────────────────────────────
    "structlog>=24.4.0",

    # ── HTTP Client ──────────────────────────────────────────────
    "httpx>=0.27.0",

    # ── UUID v7 ──────────────────────────────────────────────────
    "uuid6>=2024.1.12",

    # ── Background Jobs ──────────────────────────────────────────
    "celery[redis]>=5.4.0",
    "flower>=2.0.0",

    # ── Utilities ────────────────────────────────────────────────
    "python-slugify>=8.0.4",
    "orjson>=3.10.7",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    # ── Testing ──────────────────────────────────────────────────
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=30.0.0",

    # ── Linting & Formatting ─────────────────────────────────────
    "ruff>=0.7.0",
    "black>=24.10.0",
    "mypy>=1.13.0",

    # ── Type Stubs ───────────────────────────────────────────────
    "types-passlib>=1.7.7",
    "types-boto3>=1.35.0",
    "sqlalchemy[mypy]>=2.0.36",

    # ── Dev Tools ────────────────────────────────────────────────
    "pre-commit>=3.8.0",
    "watchfiles>=0.24.0",
]

# ── Setuptools Package Discovery ────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print (no print statements)
    "RUF",  # ruff-specific rules
]
ignore = [
    "S101",  # Use of assert (ok in tests)
    "S104",  # Possible binding to all interfaces (ok for dev)
    "B008",  # Do not perform function calls in default args (FastAPI DI pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"app/db/migrations/**/*.py" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── Black ─────────────────────────────────────────────────────────────────────
[tool.black]
target-version = ["py313"]
line-length = 100

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require running services)",
    "api: API endpoint tests",
]

# ── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
omit = [
    "app/db/migrations/*",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
