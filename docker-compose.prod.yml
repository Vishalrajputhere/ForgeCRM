# =============================================================================
# ForgeCRM — Production Docker Compose
# Version: Milestone 07 Production Readiness
# =============================================================================
# Services:
#   postgres — PostgreSQL 17 (production database with persistent volumes)
#   redis    — Redis 8 (cache and worker queue)
#   minio    — MinIO (S3-compatible object storage)
#   api      — FastAPI backend (Python 3.13 production build)
#   web      — Next.js web frontend (standalone production build)
#   nginx    — Hardened reverse proxy (TLS, CSP, rate limiting)
# =============================================================================

name: forgecrm-prod

networks:
  forgecrm_prod_network:
    driver: bridge
    name: forgecrm_prod_network
    internal: false

volumes:
  postgres_prod_data:
    name: forgecrm_postgres_prod_data
  redis_prod_data:
    name: forgecrm_redis_prod_data
  minio_prod_data:
    name: forgecrm_minio_prod_data

services:
  # ── PostgreSQL 17 (Production) ────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: forgecrm_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forgecrm}
      POSTGRES_USER: ${POSTGRES_USER:-forgecrm}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8"
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - forgecrm_prod_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forgecrm} -d ${POSTGRES_DB:-forgecrm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  # ── Redis 8 (Production) ──────────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    container_name: forgecrm_redis_prod
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-forgecrm_prod_password}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1024mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    networks:
      - forgecrm_prod_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-forgecrm_prod_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  # ── MinIO Object Storage (Production) ─────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: forgecrm_minio_prod
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-forgecrm_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-forgecrm_prod_minio_secret}
    volumes:
      - minio_prod_data:/data
    networks:
      - forgecrm_prod_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  # ── FastAPI Backend (Production Multi-Stage Build) ────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    container_name: forgecrm_api_prod
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forgecrm}:${POSTGRES_PASSWORD:-forgecrm_dev_password}@postgres:5432/${POSTGRES_DB:-forgecrm}
      REDIS_URL: redis://:${REDIS_PASSWORD:-forgecrm_dev_password}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-forgecrm_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-forgecrm_prod_minio_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-forgecrm}
      MINIO_SECURE: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    networks:
      - forgecrm_prod_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  # ── Next.js Frontend (Production Standalone Build) ────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: production
    container_name: forgecrm_web_prod
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://app.forgecrm.com}
      NEXT_PUBLIC_APP_NAME: ForgeCRM
    networks:
      - forgecrm_prod_network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  # ── Nginx Hardened Reverse Proxy (Production) ─────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: forgecrm_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
    networks:
      - forgecrm_prod_network
    depends_on:
      - api
      - web
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
