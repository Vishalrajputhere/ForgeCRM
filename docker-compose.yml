# =============================================================================
# ForgeCRM — Docker Compose
# Version: Milestone 01 Foundation
# =============================================================================
#
# Services:
#   api      — FastAPI backend (Python 3.13)
#   web      — Next.js frontend
#   postgres — PostgreSQL 17
#   redis    — Redis 8
#   minio    — MinIO (S3-compatible object storage)
#   nginx    — Reverse proxy
#
# Usage:
#   docker compose up -d          Start all services
#   docker compose up -d api web  Start specific services
#   docker compose logs -f api    Tail API logs
#   docker compose down -v        Stop and remove volumes
# =============================================================================

name: forgecrm

networks:
  forgecrm_network:
    driver: bridge
    name: forgecrm_network

volumes:
  postgres_data:
    name: forgecrm_postgres_data
  redis_data:
    name: forgecrm_redis_data
  minio_data:
    name: forgecrm_minio_data

services:
  # ── PostgreSQL 17 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: forgecrm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forgecrm}
      POSTGRES_USER: ${POSTGRES_USER:-forgecrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgecrm_dev_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8"
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - forgecrm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forgecrm} -d ${POSTGRES_DB:-forgecrm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis 8 ──────────────────────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    container_name: forgecrm_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-forgecrm_dev_password}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - forgecrm_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-forgecrm_dev_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── MinIO (S3-compatible Object Storage) ─────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: forgecrm_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-forgecrm_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-forgecrm_minio_password}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    networks:
      - forgecrm_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: forgecrm_api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev_secret_key_change_in_production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forgecrm}:${POSTGRES_PASSWORD:-forgecrm_dev_password}@postgres:5432/${POSTGRES_DB:-forgecrm}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forgecrm}:${POSTGRES_PASSWORD:-forgecrm_dev_password}@postgres:5432/forgecrm_test
      REDIS_URL: redis://:${REDIS_PASSWORD:-forgecrm_dev_password}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-forgecrm_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-forgecrm_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-forgecrm}
      MINIO_SECURE: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_jwt_secret_change_in_production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
    networks:
      - forgecrm_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Next.js Frontend ─────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    container_name: forgecrm_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-ForgeCRM}
      NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-0.1.0}
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    networks:
      - forgecrm_network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: forgecrm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - forgecrm_network
    depends_on:
      - api
      - web
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
