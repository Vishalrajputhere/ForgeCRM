name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  # ── Backend Lint ─────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend — Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Run Ruff linter
        working-directory: apps/api
        run: ruff check app/ tests/

      - name: Run Black formatter check
        working-directory: apps/api
        run: black --check app/ tests/

      - name: Run mypy type check
        working-directory: apps/api
        run: mypy app/
        continue-on-error: true  # Non-blocking during foundation — tighten in future milestones

  # ── Backend Tests ─────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend — Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forgecrm
          POSTGRES_PASSWORD: forgecrm_test_password
          POSTGRES_DB: forgecrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Create test database
        run: |
          PGPASSWORD=forgecrm_test_password psql -h localhost -U forgecrm -d forgecrm \
            -c "CREATE DATABASE forgecrm_test;"

      - name: Run tests
        working-directory: apps/api
        env:
          APP_ENV: testing
          APP_SECRET_KEY: "ci_test_secret_key_that_is_at_least_32_characters_long"
          DATABASE_URL: "postgresql+asyncpg://forgecrm:forgecrm_test_password@localhost:5432/forgecrm"
          TEST_DATABASE_URL: "postgresql+asyncpg://forgecrm:forgecrm_test_password@localhost:5432/forgecrm_test"
          REDIS_URL: "redis://localhost:6379/1"
          JWT_SECRET_KEY: "ci_jwt_secret_key_that_is_at_least_32_characters_long"
        run: pytest tests/ -v --tb=short --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: apps/api/coverage.xml
          flags: backend
        continue-on-error: true

  # ── Frontend Lint & Type Check ────────────────────────────────────────────────
  frontend-lint:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run ESLint
        working-directory: apps/web
        run: npm run lint

      - name: Run TypeScript type check
        working-directory: apps/web
        run: npm run type-check

      - name: Run Prettier check
        working-directory: apps/web
        run: npm run format:check

  # ── Frontend Build ────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build Next.js application
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_PUBLIC_APP_NAME: "ForgeCRM"
          NEXT_PUBLIC_APP_VERSION: "0.1.0"
        run: npm run build

  # ── Docker Build Verification ─────────────────────────────────────────────────
  docker-build:
    name: Docker — Build Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: false
          target: production
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: forgecrm/api:ci

      - name: Build Web Docker image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: false
          target: builder
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: forgecrm/web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
            NEXT_PUBLIC_APP_NAME=ForgeCRM
            NEXT_PUBLIC_APP_VERSION=0.1.0

  # ── Status Gate ───────────────────────────────────────────────────────────────
  ci-status:
    name: CI Status Gate
    runs-on: ubuntu-latest
    needs:
      - backend-lint
      - backend-tests
      - frontend-lint
      - frontend-build

    steps:
      - name: All checks passed
        run: echo "✅ All CI checks passed — ready to merge"
